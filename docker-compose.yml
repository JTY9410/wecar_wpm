services:
  web:
    build: .
    container_name: wecarcar1-web
    ports:
      - "8090:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///instance/wecarcar1_auto.db
      ENABLE_SCHEDULER: "0"
      SYNC_BATCH_SIZE: "500"
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  scheduler:
    build: .
    container_name: wecarcar1-scheduler
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///instance/wecarcar1_auto.db
      ENABLE_SCHEDULER: "0"
      SYNC_BATCH_SIZE: "500"
    command: ["python", "-m", "app.scheduler_main"]
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped
