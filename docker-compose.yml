# wecar WPM — independent stack (no shared network/DB with wecar PM)
name: wecarwpm

services:
  proxy:
    image: nginx:1.26-alpine
    container_name: wecarwpm-proxy
    ports:
      - "8090:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - wecarwpm_net
    restart: unless-stopped

  web:
    build: .
    image: ghcr.io/jty9410/wecar_wpm:latest
    container_name: wecarwpm-web
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///instance/wecarcar1_auto.db
      ENABLE_SCHEDULER: "0"
      SYNC_BATCH_SIZE: "500"
      # Future PM integration is inbound only (wholesale API). Leave unset until linked.
      INTEGRATION_MODE: "standalone"
      HEDONIC_MODEL_PATH: ./instance/hedonic_model.pkl
      MODEL_PATH: ./instance/car_price_model.pkl
      TRUST_PROXY: "1"
    volumes:
      - ./instance:/app/instance
    networks:
      - wecarwpm_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  scheduler:
    build: .
    image: ghcr.io/jty9410/wecar_wpm:latest
    container_name: wecarwpm-scheduler
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///instance/wecarcar1_auto.db
      ENABLE_SCHEDULER: "0"
      SYNC_BATCH_SIZE: "500"
      INTEGRATION_MODE: "standalone"
    command: ["python", "-m", "app.scheduler_main"]
    volumes:
      - ./instance:/app/instance
    networks:
      - wecarwpm_net
    restart: unless-stopped

networks:
  wecarwpm_net:
    name: wecarwpm_net
    driver: bridge
