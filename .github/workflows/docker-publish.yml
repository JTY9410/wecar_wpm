# GitHub Container Registry (ghcr.io)에 프로덕션·헤도닉 이미지를 빌드·푸시합니다.
# 저장소 Packages/컨테이너 탭에 보이려면
# 1) 패키지 이름이 저장소와 같거나 owner/repo 형태여야 하고
# 2) 패키지 visibility가 public 이어야 합니다 (vehicle-data-hub와 동일).
name: Docker Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wecar_wpm
            file: ./Dockerfile
          - name: wecar_wpm-hedonic
            file: ./Dockerfile.hedonic
    steps:
      - uses: actions/checkout@v4

      - name: GHCR login user (lowercase)
        id: ghcr_user
        run: echo "login=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.ghcr_user.outputs.login }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          no-cache: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ghcr_user.outputs.login }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.ghcr_user.outputs.login }}/${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.name }}

  make-packages-public:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Set GHCR package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          for pkg in wecar_wpm wecar_wpm-hedonic; do
            enc=${pkg//\//%2F}
            echo "▶ visibility public: ghcr.io/${OWNER_LC}/${pkg}"
            code=$(curl -sS -o /tmp/pkg-vis.json -w '%{http_code}' \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/users/${OWNER_LC}/packages/container/${enc}/visibility" \
              -d '{"visibility":"public"}' || true)
            echo "HTTP ${code}"
            cat /tmp/pkg-vis.json || true
            echo
            if [ "$code" != "204" ] && [ "$code" != "200" ]; then
              echo "::warning::Could not set ${pkg} public (HTTP ${code})."
            fi
          done
