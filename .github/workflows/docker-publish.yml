# GitHub Container Registry (ghcr.io)에 프로덕션·헤도닉 이미지를 빌드·푸시합니다.
name: Docker Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wecar_wpm
            file: ./Dockerfile
          - name: wecar_wpm-hedonic
            file: ./Dockerfile.hedonic
    steps:
      - uses: actions/checkout@v4

      - name: GHCR login user (lowercase)
        id: ghcr_user
        run: echo "login=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.ghcr_user.outputs.login }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ghcr_user.outputs.login }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.ghcr_user.outputs.login }}/${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.name }}
