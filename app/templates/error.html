{% extends "base.html" %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-4 fw-bold text-primary">{{ code }}</h1>
  <p class="text-muted">{{ message }}</p>
  <a href="{{ url_for('market.index') }}" class="btn btn-primary">홈으로</a>
</div>
{% endblock %}
{% block scripts %}
{% if show_toast %}
<script>toast({{ message|tojson }}, 'danger');</script>
{% endif %}
{% endblock %}
