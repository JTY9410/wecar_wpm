<!-- [UI Flow: GET/POST /login | auth.login — 승인된 USER/ADMIN만 세션 생성 → 시세] -->
{% extends "base.html" %}
{% block title %}로그인 - {{ config.APP_NAME }}{% endblock %}
{% block body_class %}auth-shell{% endblock %}
{% block content %}
<div class="login-page">
  <div class="login-card glass-card">
    <div class="text-center mb-4">
      <span class="brand-mark brand-mark-lg">{{ config.get('BRAND_MARK', 'WPM') }}</span>
      <h1 class="h4 mt-3 mb-1 page-title">로그인</h1>
      <p class="page-subtitle mb-0">{{ config.APP_NAME }} · 도매 시세 분석</p>
    </div>
    <form method="post">
      <div class="mb-3">
        <label class="form-label small fw-semibold">아이디</label>
        <input name="username" class="form-control" autofocus required autocomplete="username">
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">비밀번호</label>
        <input name="password" type="password" class="form-control" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary w-100 btn-lg">로그인</button>
    </form>
    <p class="text-center small mt-4 mb-0">
      <a href="{{ url_for('auth.signup') }}" class="fw-semibold">회원가입</a>
    </p>
  </div>
</div>
{% endblock %}
